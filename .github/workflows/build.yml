name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release at this version (e.g. 0.2.0). Leave blank to only build."
        required: false
        default: ""

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Runs R8 on every push, so a keep rule that breaks the Shizuku integration
      # shows up here rather than at tag time.
      - name: Assemble release APK (R8 smoke test)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: qs-actions-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    # Either push a `v*` tag, or run this workflow manually with a version — the
    # manual path creates the tag server-side via `gh release create --target`,
    # which is the only route available where tag pushes are blocked.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signs with the checked-in key by default (see signing/README.md). The
      # secrets are optional: set them and they take precedence, leave them unset
      # and the build works anyway — so this never fails for want of configuration.
      - name: Restore signing keystore, if a private one is configured
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Using the private keystore from repository secrets."
          else
            echo "Using the checked-in keystore at signing/release.jks."
          fi

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the APK is actually signed
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          # A silently unsigned APK would install nowhere; fail here instead.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Stage the APK under its release name
        id: stage
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          NAME="quick-settings-actions-${VERSION}.apk"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.stage.outputs.name }}
          VERSION: ${{ steps.stage.outputs.version }}
          TAG: ${{ steps.stage.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "Download the APK below and install it — nothing else to set up."
            echo
            echo "Universal build: every ABI in one file, so there is nothing to choose"
            echo "between. Minified with R8 and release-signed."
            echo
            echo "If you have an older debug build installed, uninstall it first — the"
            echo "signing key differs and Android will refuse the upgrade."
            echo
            echo "Requires Android 13+ and [thedjchi's Shizuku fork](https://github.com/thedjchi/Shizuku);"
            echo "upstream Shizuku exposes no start/stop intent."
          } > release-notes.md

          # --target pins the tag to this commit, and creates the tag if it does
          # not already exist.
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Quick Settings Actions $VERSION" \
            --notes-file release-notes.md
